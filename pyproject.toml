[project]
name = "net-speedmeter"
version = "0.3.0"
description = "CLI that measures download speed by fetching a heavy file N times sequentially."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1.0"]

[project.scripts]
net-speedmeter = "net_speedmeter.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=2.4.0", "pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.16.10"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "tests"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["net_speedmeter"]
branch = true
